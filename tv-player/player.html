<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIGNAL TV-Player</title>

<body class="signal-site">
<a class="skip-link" href="#inhalt">Zum Inhalt</a><div class="studio-shell"><header class="studio-header"><a class="studio-brand" href="../index.html"><img src="../easy-radio/assets/images/signal-radio.svg" alt="" width="42" height="42"><span>SIGNAL STUDIO<small>Radio &amp; TV</small></span></a><nav class="studio-nav" aria-label="Hauptnavigation"><a href="../easy-radio/player.html">Radio</a><a href="../tv-player/player.html" aria-current="page">Live TV</a><a href="../admin/login.php">Verwaltung</a></nav></header>
<div class="player-layout">
    <main id="inhalt" class="signal-tv-player" data-tv-player aria-labelledby="signal-tv-title">
        <header class="tv-brand">
            <img class="tv-logo" src="assets/images/signal-tv.svg" width="88" height="88" alt="SIGNAL Studio TV-Logo">

                <span class="tv-kicker">SIGNAL Studio</span>

</div>
<footer class="studio-footer"><span>SIGNAL Studio &middot; Radio &amp; Live TV</span><nav aria-label="Weitere Links"><a href="../easy-radio/player.html">Radio h&ouml;ren</a><a href="../tv-player/player.html">TV ansehen</a></nav></footer></div>
    <script src="assets/js/hls.min.js"></script>

        window.signalTvSettings = {

            fallbackLogo: new URL('assets/images/signal-tv.svg', window.location.href).href,
